apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: orders-dev
  namespace: argocd
spec:
  description: Orders API and Worker DEV. Namespaced GitOps delivery with HPA and
    HTTPS hosts.
  sourceRepos:
  - ssh://git@ssh.github.com:443/rlcosmo/cosmotech-gitops.git
  destinations:
  - server: https://4A29FB418B3281BEF628A7122A8CAEDD.gr7.us-east-1.eks.amazonaws.com
    namespace: orders-api
  - server: https://4A29FB418B3281BEF628A7122A8CAEDD.gr7.us-east-1.eks.amazonaws.com
    namespace: orders-worker
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: apps
    kind: Deployment
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: apps
    kind: ReplicaSet
  - group: ''
    kind: Pod
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: networking.k8s.io
    kind: Ingress
