name: deliver-dev
on:
  push:
    branches: [main]
    paths: [gitops/apps/**, gitops/releases/orders-api-dev.json, gitops/releases/orders-worker-dev.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orders-dev-gitops-delivery
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::414053644145:role/cosmotech-gitops-github-sync
          aws-region: us-east-1
      - name: Show this management-cluster delivery in Kestra
        run: python scripts/report_kestra.py --app gitops --stage validate --state running
      - id: manifest_checks
        run: python scripts/validate_app_manifests.py
      - id: promotion_tests
        run: python -m unittest discover -s tests -v
      - name: Record validation and start Argo rollout
        run: |
          python scripts/report_kestra.py --app gitops --stage validate --state success
          python scripts/report_kestra.py --app gitops --stage rollout --state running
      - id: argo_sync
        name: Reconcile this immutable main revision through the existing Argo CD
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command --document-name CosmoTech-Sync-Orders-GitOps \
            --document-version '$LATEST' --instance-ids i-0b33fdd51332e04e5 \
            --parameters "GitRevision=$GITHUB_SHA" --query Command.CommandId --output text)"
          echo "SSM command: $command_id" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 180); do
            if aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id i-0b33fdd51332e04e5 > "$RUNNER_TEMP/argo-delivery.json" 2>/dev/null; then
              status="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["Status"])' "$RUNNER_TEMP/argo-delivery.json")"
              case "$status" in
                Success) cat "$RUNNER_TEMP/argo-delivery.json"; exit 0 ;;
                Failed|Cancelled|TimedOut|Cancelling) cat "$RUNNER_TEMP/argo-delivery.json"; exit 1 ;;
              esac
            fi
            sleep 5
          done
          echo 'Argo reconciliation did not complete within 15 minutes' >&2
          exit 1
      - name: Record exact-revision Argo success
        run: |
          python scripts/report_kestra.py --app gitops --stage rollout --state success
          python scripts/report_kestra.py --app gitops --stage health --state running
      - id: external_health
        name: Verify external HTTPS health after Argo reconciliation
        shell: bash
        run: |
          set -euo pipefail
          for app in orders-api orders-worker; do
            if [[ "$app" == orders-worker ]] && ! python3 -c 'import json; assert json.load(open("gitops/bootstrap/orders-worker-application.json"))["spec"]["syncPolicy"]["automated"]["enabled"]'; then
              continue
            fi
            for probe in live ready; do
              curl --fail --silent --show-error --max-time 10 --retry 20 --retry-all-errors --retry-delay 5 \
                "https://$app-dev.cosmotechsolutions.com.br/health/$probe"
            done
            echo "$app: external HTTPS health passed" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Record delivery outcome and correlate the original app pipelines
        if: always()
        env:
          VALIDATION: ${{ steps.promotion_tests.outcome }}
          ARGO_STATE: ${{ steps.argo_sync.outcome }}
          HEALTH_STATE: ${{ steps.external_health.outcome }}
          JOB_STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$VALIDATION" != success ]]; then
            python scripts/report_kestra.py --app gitops --stage validate --state "$JOB_STATE"
            exit 0
          fi
          if [[ "$ARGO_STATE" != success ]]; then stage=rollout; else stage=health; fi
          python scripts/report_kestra.py --app gitops --stage "$stage" --state "$JOB_STATE"
          python3 - <<'PYTHON' > "$RUNNER_TEMP/source-apps"
          import json,re
          for app in ['orders-api','orders-worker']:
              image=json.load(open(f'gitops/apps/{app}/dev/deployment.json'))['spec']['template']['spec']['containers'][0]['image']
              match=re.search(r':sha-([a-f0-9]{40})@sha256:',image)
              if match:print(app,match[1])
          PYTHON
          while read -r app sha; do
            if [[ "$ARGO_STATE" == success ]]; then
              python scripts/report_kestra.py --app "$app" --source-sha "$sha" --stage rollout --state success
              python scripts/report_kestra.py --app "$app" --source-sha "$sha" --stage health --state "$JOB_STATE"
            else
              python scripts/report_kestra.py --app "$app" --source-sha "$sha" --stage rollout --state "$JOB_STATE"
            fi
          done < "$RUNNER_TEMP/source-apps"
