name: approve-gitops-release
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  verify-protections:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unprotected or unsupported private-repository approvals
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for gate in dev qa po-pm infra-sre; do
            gh api "repos/$GITHUB_REPOSITORY/environments/$gate" > "$RUNNER_TEMP/gate-$gate.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" > "$RUNNER_TEMP/branch-protection.json"
          python3 - <<'CHECK'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for gate in ['dev','qa','po-pm','infra-sre']:
              value=json.loads((root/f'gate-{gate}.json').read_text())
              rules=value.get('protection_rules',[])
              assert any(r.get('type')=='required_reviewers' and any(
                  x.get('reviewer',{}).get('id')==124368446 for x in r.get('reviewers',[])
              ) for r in rules), f'{gate}: real owner reviewer protection is missing'
          protection=json.loads((root/'branch-protection.json').read_text())
          assert protection.get('enforce_admins',{}).get('enabled'), 'Admin enforcement missing'
          assert 'release-approved' in protection.get('required_status_checks',{}).get('contexts',[]), 'Release check missing'
          CHECK
  dev:
    needs: verify-protections
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo 'Real DEV approval recorded for this PR revision.'
  qa:
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - run: echo 'Real QA approval recorded for this PR revision.'
  po-pm:
    needs: qa
    runs-on: ubuntu-latest
    environment: po-pm
    steps:
      - run: echo 'Real PO/PM approval recorded for this PR revision.'
  infra-sre:
    needs: po-pm
    runs-on: ubuntu-latest
    environment: infra-sre
    steps:
      - run: echo 'Real Infra/SRE approval recorded for this PR revision.'
  release-approved:
    if: always()
    needs: [verify-protections, dev, qa, po-pm, infra-sre]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or skipped protection and approval gates
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'CHECK'
          import json,os
          results=json.loads(os.environ['GATE_RESULTS'])
          expected={'verify-protections','dev','qa','po-pm','infra-sre'}
          assert set(results)==expected, 'Missing gate result'
          assert all(value['result']=='success' for value in results.values()), 'Release blocked: every protection and actual human gate must succeed'
          print('Four human gates completed. Actual GLPI/GMUD authorization and an authorized merge/manual Argo sync remain required.')
          CHECK
