name: validate-dev-image
on:
  pull_request:
    branches: [main]
    paths: [gitops/apps/**, gitops/releases/**]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
        default: '1'
permissions:
  contents: read
  pull-requests: read
jobs:
  validate-dev-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate DEV image-only promotion without human approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 - <<'CHECK' > "$RUNNER_TEMP/revisions"
          import json,os,pathlib,re
          p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pr.json').read_text())
          if p['base']['ref']!='main' or p['head']['repo']['full_name']!=os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Unexpected promotion repository or base')
          for sha in [p['base']['sha'],p['head']['sha']]:
              if not re.fullmatch('[0-9a-f]{40}',sha):raise SystemExit('Invalid revision')
              print(sha)
          CHECK
          mapfile -t revisions < "$RUNNER_TEMP/revisions"
          git fetch origin "${revisions[0]}" "${revisions[1]}"
          changed="$(git diff --name-only "${revisions[0]}...${revisions[1]}")"
          case "$changed" in
            gitops/apps/orders-api/dev/deployment.json) app=orders-api ;;
            gitops/apps/orders-worker/dev/deployment.json) app=orders-worker ;;
            *)
              for candidate in orders-api orders-worker; do
                proof="gitops/releases/${candidate}-dev.json"
                if git cat-file -e "${revisions[1]}:$proof" 2>/dev/null && grep -qx "$proof" <<< "$changed"; then
                  git show "${revisions[1]}:$proof" > "$RUNNER_TEMP/deployment-bundle.json"
                  python3 scripts/validate_dev_image.py --application "$candidate" --base "${revisions[0]}" --head "${revisions[1]}" --expected-manifests "$RUNNER_TEMP/deployment-bundle.json"
                  exit 0
                fi
              done
              echo 'This change is outside automatic application delivery.'; exit 0 ;;
          esac
          python3 scripts/validate_dev_image.py --application "$app" --base "${revisions[0]}" --head "${revisions[1]}"
