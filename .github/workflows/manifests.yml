name: validate-application-manifests
on:
  push:
    branches: [main]
    paths: [gitops/**, scripts/**, tests/**, .github/workflows/manifests.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/validate_app_manifests.py
      - run: python -m unittest discover -s tests -v
